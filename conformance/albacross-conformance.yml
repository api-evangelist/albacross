compliance_pointer_decision: >
  No `Compliance` pointer is emitted in apis.yml. Albacross publishes legal documents (Privacy
  Policy, Cookie Policy, DPA) and asserts GDPR/CCPA compliance in prose, but operates no trust
  centre and names no audited certification (SOC 2, ISO 27001) anywhere public. Emitting a
  Compliance pointer for a self-asserted claim with no certification behind it would credit a
  compliance programme this company has not published.
