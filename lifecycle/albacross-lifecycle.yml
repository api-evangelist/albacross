  deprecation_header: false
  rfc8594: false
  note: >
    No deprecation policy is published anywhere on albacross.com, docs.albacross.com or
    help.albacross.com, and no Sunset or Deprecation response header was observed on any live
    probe. Albacross does have a live deprecation in flight and has documented it nowhere: the
    published Reveal OpenAPI declares its production server as reveal.api.albacross.com, while the
    current developer portal documents the same capability at api.albacross.com/reveal/company/{ip}.
    Both hosts answer, on different infrastructure (AWS API Gateway vs an Express/nginx edge), with
    no statement of which is canonical or when the older one stops.
