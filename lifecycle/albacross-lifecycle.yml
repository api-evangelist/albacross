deprecated_operations: []
host_sprawl:
  note: >
    The Albacross-published Reveal OpenAPI declares TWO servers, and both are live and reachable
    from the public internet. The second, https://reveal.api.albakaos.com, is labelled "Staging
    data" in the spec — a staging environment on a separate registrable domain (albakaos.com),
    published in a public specification document and answering the same 401 auth envelope as
    production when probed anonymously on 2026-08-12. Combined with the third, documentation-only
    host (api.albacross.com), Albacross exposes the same Reveal capability on three live hosts
    across two domains with no published statement of which is canonical, which is deprecated, or
    which is not intended for public traffic.
  hosts:
  - {host: 'https://reveal.api.albacross.com', role: production (per published OpenAPI), status: 401, live: true}
  - {host: 'https://reveal.api.albakaos.com', role: staging (per published OpenAPI), status: 401, live: true}
  - {host: 'https://api.albacross.com/reveal', role: documented on the current developer portal, status: 401, live: true}
  checked: '2026-08-12'

surface_decay:
  note: >
    Read alongside packages/albacross-packages.yml. Three of the four repositories in the Albacross
    GitHub organisation have not been pushed since 2020 (gtm-reveal, gtm-tracking) or 2018
    (joomla_plugin). Only n8n-nodes-albacross is current (pushed 2026-06-04). The published Reveal
    OpenAPI has no dated version to age against.
