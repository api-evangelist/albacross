  spec_version: '1.0'
  docs: https://docs.albacross.com/
  note: >
    No runtime versioning. No version segment in any documented path, no version header, no version
    negotiation. The published Reveal OpenAPI carries info.version '1.0' but that string is not
    addressable and has no dated release behind it. A breaking change to the Company object would
    reach every consumer at once with no opt-out.
