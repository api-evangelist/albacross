envelope:
  content_type: application/json
  schema:
    infos: {type: array, items: string, description: Informational messages; empty in every observed response.}
    errors: {type: array, items: string, description: Human-readable English error strings. No stable code, no type URI, no field pointer.}
  example: '{"infos":[],"errors":["Authentication required - please provide a valid API key"]}'
  note: >
    The runtime envelope does NOT match the published OpenAPI. The spec's ErrorMessage schema
    declares a single required `message` string; every live error response returns
    {"infos":[...],"errors":[...]} instead. A generated client built from the spec would fail to
    parse the real error body. This divergence is recorded, not corrected — the spec is Albacross's
    to fix.
machine_readability:
  stable_error_codes: false
  type_uris: false
  field_pointers: false
  note: >
    Branching on an Albacross error requires string-matching English prose. Two different auth
    failures on two different endpoints return two different strings ("Authentication required -
    please provide a valid API key" vs "No authorization header") under two different status codes
    (401 vs 403) for what is the same underlying condition — a missing key.
