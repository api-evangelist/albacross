aid: albacross
name: Albacross
description: Albacross is a Stockholm-founded B2B intent data and lead generation platform that identifies
  anonymous website visitors by IP, enriches them with firmographic data, segments them by buying intent
  using AI, and auto-engages high-intent prospects through email and LinkedIn sequences. For developers
  it exposes a small, key-authenticated HTTP surface on api.albacross.com — a Reveal API that resolves an
  IPv4 address to a company profile, an Enrich API that resolves a website domain to the same firmographic
  record (name, country, registration number, address, LinkedIn URL, employee band, revenue band, NACE and
  LinkedIn industry codes), and an n8n automation API for registering lead webhooks. Outbound webhooks
  push identified-company leads into workflows in real time. The company publishes an OpenAPI 3.0.3
  document for the Reveal API and an llms.txt at its website root.
