summary: >
  Albacross's client-side surface is a tracking pixel, not a UI component library. There is no
  embeddable widget, web component, element library or hosted prebuilt view. What Albacross ships
  to the browser is a single JavaScript tracker that identifies the visitor's IP, plus two Google
  Tag Manager templates that wrap it, a Chrome extension for the operator (not the visitor), and
  a Joomla plugin. All four are the collection side of the product, not a rendering surface.
